    chain: "weak FTP/SSH creds + SSH brute force -> Linux privesc"
    attack_techniques: [T1110.001, T1078, T1068]
    role: "validates the SSH brute-force rule -> M1 fixture #1"

  - name: symfonos-1
    archive: "symfonos1.7z"
    os: "Debian"
    agent: true
    ip: 10.10.0.13
    chain: "SMB -> LFI -> SMTP log poisoning -> shell -> PATH privesc"
    attack_techniques: [T1135, T1083, T1059.004, T1574.007]
    role: "report already written = ground truth in hand"

  - name: mr-robot
    archive: "mrRobot.ova"
    os: "Ubuntu ~2015"
    agent: true
    ip: 10.10.0.14
    chain: "WordPress brute force -> wp shell -> SUID nmap privesc"
    attack_techniques: [T1110.001, T1059.004, T1548.001]
