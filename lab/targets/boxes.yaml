#        false => network-only, covered by Zeek alone.
# verify: the agent flag is a first-boot assumption until confirmed (an M0 task).

boxes:
  - name: dc-1
    archive: "DC-1.zip"
    os: "Debian ~2019"
    agent: true
    ip: 10.10.0.11
    chain: "Drupalgeddon2 web RCE -> www-data -> SUID find privesc"
    attack_techniques: [T1190, T1059.004, T1548.001]
    role: "primary host+network target"

  - name: basic-pentesting-1
    archive: "basic_pentesting_1.ova"
