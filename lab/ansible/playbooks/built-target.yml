---
# Provision the clean Ubuntu detection target: pinned clock, rich host logging,
# and an enrolled Wazuh agent. This is the box where host-based detection and
# MTTD are trustworthy (unlike the old VulnHub images).
- name: Built detection target
  hosts: built_target
  become: true
  gather_facts: true

  tasks:
    # --- clock discipline (MTTD depends on it) ---
    - name: Install systemd-timesyncd
      ansible.builtin.apt:
        name: systemd-timesyncd
        state: present
        update_cache: true

    - name: Point timesyncd at the lab NTP upstream
      ansible.builtin.copy:
        dest: /etc/systemd/timesyncd.conf
        mode: "0644"
        content: |
          [Time]
          NTP={{ ntp_server }}
      notify: restart timesyncd

    - name: Enable NTP synchronization
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false

    # --- host telemetry ---
    - name: Install auditd for richer host-based detection
      ansible.builtin.apt:
        name: auditd
        state: present

    - name: Ensure auditd is running
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

    # --- Wazuh agent ---
    - name: Import the Wazuh apt signing key
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
        dest: /tmp/wazuh.key
        mode: "0644"

    - name: Dearmor the key into the keyring
      ansible.builtin.command:
        cmd: gpg --batch --yes -o /usr/share/keyrings/wazuh.gpg --dearmor /tmp/wazuh.key
        creates: /usr/share/keyrings/wazuh.gpg

    - name: Add the Wazuh apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present

    - name: Install the Wazuh agent (enrolled against the manager)
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
        update_cache: true
      environment:
        WAZUH_MANAGER: "{{ manager_ip }}"

    - name: Pin the manager address in the agent config
      ansible.builtin.lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: "<address>.*</address>"
        line: "      <address>{{ manager_ip }}</address>"
      notify: restart wazuh-agent

    - name: Enable and start the agent
      ansible.builtin.service:
        name: wazuh-agent
        state: started
        enabled: true

  handlers:
    - name: restart timesyncd
      ansible.builtin.service:
        name: systemd-timesyncd
        state: restarted

    - name: restart wazuh-agent
      ansible.builtin.service:
        name: wazuh-agent
        state: restarted
