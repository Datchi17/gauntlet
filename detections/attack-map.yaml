# Gauntlet detection coverage — which rule detects which MITRE ATT&CK technique,
# and the fixture that proves it fires. The scorer joins attacker actions to SIEM
# alerts on `technique`; pull_alerts.py keeps only these rule_ids (so Wazuh's base
# events don't masquerade as false positives).
#
# `validation` is deliberately honest and is the headline status of this project:
#   live    = fired end-to-end by a REAL attack against live telemetry, then
#             scored by the loop (ground-truth action <-> real SIEM alert).
#   fixture = the rule fires on a hand-written sample log via wazuh-logtest
#             (detections/test_detections.py), but has NOT yet been tripped by a
#             real attack. This proves the rule's logic, NOT the end-to-end claim.
# Run `python3 detections/coverage_report.py` (or `make status`) for the summary.
coverage:
  # ---------- Credential Access / Valid Accounts ----------
  - technique: T1110.001
    tactic: credential-access
    name: "SSH brute force (non-existent user)"
    source: wazuh
    rule_ids: [100200]
    fixture: fixtures/ssh_bruteforce.log
    status: implemented
    validation: live          # proven end-to-end: hydra -> rule 100200, scored by the loop
  - technique: T1110.001
    tactic: credential-access
    name: "SSH brute force (wrong password)"
    source: wazuh
    rule_ids: [100201]
    fixture: fixtures/ssh_bruteforce_password.log
    status: implemented
    validation: fixture
  - technique: T1110.001
    tactic: credential-access
    name: "Compromise: SSH success from a brute-forcing IP"
    source: wazuh
    rule_ids: [100202]
    fixture: fixtures/ssh_compromise.log
    status: implemented
    validation: fixture
  - technique: T1078
    tactic: initial-access
    name: "Valid Accounts: successful SSH authentication"
    source: wazuh
    rule_ids: [100203]
    fixture: fixtures/ssh_success.log
    status: implemented
    validation: fixture

  # ---------- Privilege Escalation ----------
  - technique: T1548.003
    tactic: privilege-escalation
    name: "Unauthorized sudo attempt"
    source: wazuh
    rule_ids: [100210]
    fixture: fixtures/sudo_unauthorized.log
    status: implemented
    validation: fixture
  - technique: T1548.003
    tactic: privilege-escalation
    name: "Sudo brute force (repeated unauthorized)"
    source: wazuh
    rule_ids: [100211]
    fixture: fixtures/sudo_bruteforce.log
    status: implemented
    validation: fixture
  - technique: T1548.003
    tactic: privilege-escalation
    name: "Successful sudo to root"
    source: wazuh
    rule_ids: [100212]
    fixture: fixtures/sudo_to_root.log
    status: implemented
    validation: fixture

  # ---------- Persistence ----------
